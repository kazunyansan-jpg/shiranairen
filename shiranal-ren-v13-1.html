    function ChatScene({ scene, onComplete, onBackToTitle }) {
      const [visibleCount, setVisibleCount] = useState(0);
      const [readMap, setReadMap] = useState({});
      const [showTyping, setShowTyping] = useState(false);
      const [allDone, setAllDone] = useState(false);
      const scrollRef = useRef(null);
      const timeoutsRef = useRef([]);

      const scrollToBottom = (delay) => {
        setTimeout(() => {
          const el = scrollRef.current;
          if (el) el.scrollTop = el.scrollHeight + 9999;
        }, delay !== undefined ? delay : 60);
      };

      const skipAll = () => {
        timeoutsRef.current.forEach(clearTimeout);
        timeoutsRef.current = [];
        setShowTyping(false);
        setVisibleCount(scene.messages.length);
        const all = {};
        scene.messages.forEach((msg, i) => { if (msg.from === "yui") all[i] = true; });
        setReadMap(all);
        const t = setTimeout(() => { setAllDone(true); scrollToBottom(80); }, 150);
        timeoutsRef.current = [t];
        scrollToBottom(80);
      };

      const handleTap = () => {
        if (allDone) { onComplete(); return; }
        skipAll();
      };

      useEffect(() => {
        setVisibleCount(0); setReadMap({}); setShowTyping(false); setAllDone(false);
        scrollToBottom(0);
        const timeouts = [];
        let cumulativeDelay = 0;
        scene.messages.forEach((msg, i) => {
          const extraDelay = msg.extraDelay || 0;
          if (msg.from === "ren") {
            const t0 = setTimeout(() => { setShowTyping(true); scrollToBottom(); }, cumulativeDelay + 50);
            timeouts.push(t0);
          }
          const showAt = cumulativeDelay + (msg.from === "ren" ? TYPING_DURATION + 200 : 200);
          const t = setTimeout(() => {
            setShowTyping(false);
            setVisibleCount(i + 1);
            scrollToBottom();
            if (msg.from === "yui") {
              const delay = msg.readDelay !== undefined ? msg.readDelay : DEFAULT_READ_DELAY;
              const tr = setTimeout(() => setReadMap(prev => ({ ...prev, [i]: true })), delay);
              timeouts.push(tr);
            }
            if (i === scene.messages.length - 1) {
              const t2 = setTimeout(() => { setAllDone(true); scrollToBottom(); }, 500);
              timeouts.push(t2);
            }
          }, showAt);
          timeouts.push(t);
          cumulativeDelay += MSG_INTERVAL + extraDelay;
        });
        timeoutsRef.current = timeouts;
        return () => timeouts.forEach(clearTimeout);
      }, [scene]);

      return (
        <div style={{ display: "flex", flexDirection: "column", height: "100vh" }}>
          <div style={{
            background: "#00B900", color: "white", padding: "13px 16px",
            fontSize: "0.9rem", fontWeight: "700", flexShrink: 0,
            boxShadow: "0 2px 4px rgba(0,0,0,0.15)",
            display: "flex", alignItems: "center", justifyContent: "space-between",
          }}>
            <span>{scene.header || "メッセージ"}</span>
            <button onClick={onBackToTitle} style={{
              background: "rgba(0,0,0,0.18)", border: "none", color: "rgba(255,255,255,0.85)",
              borderRadius: 12, padding: "4px 10px", fontSize: "0.72rem", cursor: "pointer", flexShrink: 0,
            }}>タイトル</button>
          </div>
          <div ref={scrollRef} onClick={handleTap} style={{ flex: 1, background: "#C8E6C9", overflowY: "auto", paddingTop: 16, paddingBottom: 16, cursor: "pointer" }}>
            {scene.messages.map((msg, i) => (
              <ChatBubble key={i} msg={msg} visible={i < visibleCount} showRead={!!readMap[i]} />
            ))}
            {showTyping && <TypingIndicator />}
            {allDone && <TapToContinue />}
          </div>
        </div>
      );
    }

          <div style={{ marginTop: "2.5rem", fontSize: "0.68rem", color: "rgba(255,255,255,0.25)", lineHeight: 2, letterSpacing: "0.05em" }}>
            © 2025 Koyama. 教育・啓発目的での使用・転載を許可します。<br/>
            商用利用・改変・著作権表記の削除は禁止します。<br/>
            開発：Koyama / AI協力：Mio・Arisa　v1.0.0
          </div>
        </div>
      );
    }

    function ConfirmDialog({ message, onOk, onCancel }) {
      return (
        <div onClick={(e) => e.stopPropagation()} style={{
          position: "fixed", inset: 0, zIndex: 9999,
          background: "rgba(0,0,0,0.55)",
          display: "flex", alignItems: "center", justifyContent: "center",
          padding: "2rem",
        }}>
          <div style={{
            background: "white", borderRadius: 16, padding: "1.5rem 1.25rem",
            maxWidth: "300px", width: "100%",
            boxShadow: "0 8px 32px rgba(0,0,0,0.25)",
            textAlign: "center",
          }}>
            <div style={{ fontSize: "0.95rem", color: "#333", lineHeight: 1.7, marginBottom: "1.25rem", whiteSpace: "pre-wrap" }}>{message}</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              <button onClick={onCancel} style={{
                flex: 1, padding: "11px 0", borderRadius: "2rem",
                border: "1px solid #ccc", background: "white",
                fontSize: "0.9rem", color: "#555", cursor: "pointer", fontWeight: "600",
              }}>キャンセル</button>
              <button onClick={onOk} style={{
                flex: 1, padding: "11px 0", borderRadius: "2rem",
                border: "none", background: "#ff5533",
                fontSize: "0.9rem", color: "white", cursor: "pointer", fontWeight: "700",
              }}>戻る</button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [mode, setMode] = useState("title");
      const [currentId, setCurrentId] = useState("intro");
      const [adultId, setAdultId] = useState("adult_intro");
      const [showConfirm, setShowConfirm] = useState(false);

      const scenes = mode === "adult" ? ADULT_SCENES : SCENES;
      const id = mode === "adult" ? adultId : currentId;
      const scene = scenes[id];
      const goTo = (next) => mode === "adult" ? setAdultId(next) : setCurrentId(next);
      const restart = () => {
        if (mode === "adult") setAdultId("adult_intro");
        else setCurrentId("intro");
      };
      const backToTitle = () => setShowConfirm(true);
      const confirmBack = () => { setShowConfirm(false); setMode("title"); };
      const cancelBack = () => setShowConfirm(false);

      if (mode === "title") return <TitleScreen onStart={() => setMode("child")} onStartAdult={() => setMode("adult")} />;

      if (mode === "adult") return (
        <div style={{ paddingTop: "44px" }}>
          {showConfirm && <ConfirmDialog message={"タイトルに戻りますか？\n進行中のデータは失われます。"} onOk={confirmBack} onCancel={cancelBack} />}
          <div style={{
            position: "fixed", top: 0, left: 0, right: 0, zIndex: 100,
            background: "#1a1a2e", color: "rgba(255,255,255,0.4)",
            padding: "0 16px", height: "44px",
            fontSize: "0.75rem", letterSpacing: "0.1em",
            display: "flex", alignItems: "center", gap: 8,
          }}>
            <button
              onClick={(e) => { e.stopPropagation(); backToTitle(); }}
              onTouchEnd={(e) => { e.stopPropagation(); e.preventDefault(); backToTitle(); }}
              style={{
                background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)",
                color: "rgba(255,255,255,0.7)", cursor: "pointer",
                fontSize: "0.8rem", padding: "6px 14px", borderRadius: "20px",
              }}>← タイトルへ</button>
            <span>｜ 保護者・教職員向けモード</span>
          </div>
          {scene && scene.type === "narration" && <NarrationScene key={id} scene={scene} onComplete={() => goTo(scene.next)} />}
          {scene && scene.type === "choice" && <ChoiceScene key={id} scene={scene} onSelect={goTo} />}
          {scene && scene.type === "good_end" && <GoodEndScene key={id} scene={scene} onRestart={restart} />}
        </div>
      );

      return (
        <div>
          {showConfirm && <ConfirmDialog message={"タイトルに戻りますか？\n進行中のデータは失われます。"} onOk={confirmBack} onCancel={cancelBack} />}
          {scene && scene.type === "narration" && <NarrationScene key={currentId} scene={scene} onComplete={() => goTo(scene.next)} />}
          {scene && scene.type === "chat" && <ChatScene key={currentId} scene={scene} onComplete={() => goTo(scene.next)} onBackToTitle={backToTitle} />}
          {scene && scene.type === "monologue" && <MonologueScene key={currentId} scene={scene} onComplete={() => goTo(scene.next)} />}
          {scene && scene.type === "choice" && <ChoiceScene key={currentId} scene={scene} onSelect={goTo} />}
          {scene && scene.type === "good_end" && <GoodEndScene key={currentId} scene={scene} onRestart={restart} onBackToTitle={backToTitle} />}
          {scene && scene.type === "resources" && <ResourcesScene key={currentId} onRestart={restart} onBackToTitle={backToTitle} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
