<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知らない「れん」</title>
  
  
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    button { font-family: inherit; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes typing { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-5px); opacity:1; } }
    @keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
  
button:focus-visible {outline:3px solid #175fa8;outline-offset:4px}
.pause {position:fixed;right:12px;bottom:12px;z-index:30;border:1px solid #aaa;border-radius:20px;background:#fffffff2;color:#304539;padding:9px 14px;font-size:12px;box-shadow:0 2px 12px #0002;cursor:pointer}
.pause-overlay{position:fixed;inset:0;background:#10221bcc;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.pause-card{background:#f7faf6;padding:26px;border-radius:20px;max-width:390px;display:grid;gap:16px;line-height:1.8}
.pause-card h2{font-size:20px}.review{min-height:100vh;background:#eef4ef;color:#243d31;padding:40px 20px 60px}.review-inner{max-width:640px;margin:auto}.review h1{font-size:30px;line-height:1.5;margin:12px 0 22px}.review p{line-height:1.9;margin:12px 0}.review section{padding:24px;background:white;border-radius:18px;margin:18px 0;border:1px solid #dbe6dd}.review h2{font-size:18px;line-height:1.6;margin-bottom:12px}.review ul{padding-left:22px;line-height:1.9}.review li{margin:12px 0}.review .warm{background:#fff5df}.review .note{font-size:13px;color:#506356}.eyebrow{font-size:12px;letter-spacing:.12em}.end-review-bar{background:#edf5ef;text-align:center;padding:16px;position:sticky;top:0;z-index:10}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.photo-thumb{position:relative;display:block;width:100%;max-width:330px;padding:0;margin:0 auto;border:0;border-radius:10px;overflow:hidden;background:#ecede9;cursor:zoom-in;color:#344a40}
.photo-frame{position:relative;display:block}.photo-frame img{display:block;width:100%;height:auto;object-fit:contain}.photo-open-label{display:block;text-align:center;font-size:11px;line-height:2;background:#f3f7f3;color:#41584b}
.photo-mark{position:absolute;right:0.8%;bottom:0.8%;width:37%;height:34%;border:3px solid #ff852a;border-radius:8px;box-shadow:0 0 0 2px #fff9;pointer-events:none}
.photo-modal{position:fixed;inset:0;z-index:1000;background:#102018f5;color:white;display:flex;flex-direction:column;padding:16px;gap:12px}.photo-toolbar{display:flex;justify-content:space-between;gap:16px}.photo-toolbar button{border:1px solid #9ebdad;border-radius:18px;background:#203d30;color:white;font-size:16px;padding:10px 18px;cursor:pointer}.photo-viewport{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;overscroll-behavior:contain}.photo-viewport>.photo-frame{max-width:min(90vw,72dvh);width:100%}.photo-viewport.zoomed{display:block}.photo-viewport.zoomed>.photo-frame{width:200%;max-width:none}.photo-modal>p{text-align:center;font-size:12px;line-height:1.8}.review .photo-thumb{margin:18px auto}.review section>button{margin:8px 0}

.video-preview{margin:0;max-width:330px}.video-still{position:relative}.video-play{position:absolute;left:50%;top:calc(50% - 10px);transform:translate(-50%,-50%);display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#162b22bb;border:1px solid #ffffff99;color:white;font-size:24px;padding-left:4px;pointer-events:none}.video-preview figcaption{font-size:13px;font-style:normal;line-height:1.6;margin-top:8px}.video-preview small{font-size:11px;color:#536257}.withheld-photo{width:230px;max-width:100%;border-radius:12px;overflow:hidden;background:#eef1ef;color:#31443a;font-style:normal}.withheld-art{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#d0d8d2,#b8c9c1 55%,#d7d3c5)}.image-outline{position:relative;display:block;width:60px;height:46px;border:2px solid #ffffffcc;border-radius:5px;overflow:hidden}.image-outline:before{content:'';position:absolute;left:10px;top:8px;width:8px;height:8px;background:#fff9;border-radius:50%}.image-outline span{position:absolute;bottom:-17px;left:13px;width:42px;height:42px;background:#ffffff77;transform:rotate(45deg);border-radius:4px}.withheld-caption{padding:12px;font-size:12px;line-height:1.8;text-align:center}.withheld-caption strong{font-weight:600}.withheld-caption span{font-size:11px;color:#5a6b60}

.photo-frame.portrait-frame{aspect-ratio:760 / 1020;overflow:hidden;background:#e5e5e1;width:100%}
.photo-frame.portrait-frame img{position:absolute;width:202.105263%;max-width:none;height:auto;object-fit:contain}
.portrait-yui img{left:-0.526316%;top:-13.72549%}.portrait-ren img{left:-101.578947%;top:-17.647059%}
.photo-viewport>.portrait-frame{max-width:min(90vw,52dvh)}.photo-viewport.zoomed>.portrait-frame{width:200%;max-width:none}

.learn-more{background:#fff;border:1px solid #cbdacf;border-radius:14px;margin:20px 0;overflow:hidden;color:#304b39}
.learn-more summary{padding:18px;font-size:15px;font-weight:600;line-height:1.7;cursor:pointer;list-style-position:inside}
.learn-more summary:focus-visible{outline:3px solid #247554;outline-offset:-3px}
.learn-more[open] summary{border-bottom:1px solid #dbe6de;background:#f2f7f2}
.learn-content{padding:20px;line-height:1.9;font-size:14px}.learn-content p{margin:0 0 14px}.ending-details{max-width:380px;width:100%;margin:0 0 28px}.review-details-body{padding:16px;font-size:14px}.review-details-body h1{font-size:22px}.review-details-body section{padding:16px}.review-inner>.learn-more+.learn-more{margin-top:14px}
</style>

<script>const{useState,useEffect,useRef}=React;const MSG_INTERVAL=1400;const TYPING_DURATION=800;const DEFAULT_READ_DELAY=600;const SCENES={intro:{type:"narration",variant:"default",lines:["あなたは中学2年生の結衣。","放課後、一人で部屋でスマホのゲームをしていた。","友達もいるし、学校が嫌いなわけじゃない。","ただ——\n本当のことを話せる相手が、いない気がしていた。"],next:"meeting"},meeting:{type:"chat",header:"🎮 ゲーム内チャット",messages:[{from:"ren",text:"助けてくれてありがとう！めっちゃ助かった"},{from:"yui",text:"えへへ、たまたまです笑"},{from:"ren",text:"ゲームうまいね、何年やってる？"},{from:"yui",text:"半年くらい。れんくんのほうが強いじゃん"},{from:"ren",text:"俺高1なんだけど結衣ちゃんは？"},{from:"yui",text:"中2です"},{from:"ren",text:"年近いじゃん。またいっしょにやろうよ"}],next:"mono_weeks"},mono_weeks:{type:"monologue",text:"それから、れんくんとよく話すようになった。\n\n学校での小さな出来事や、\n変な先生の話、友達のこと。\nれんくんが飼っている猫の名前はムギ。\nギターが得意らしくて、\n手元だけの演奏動画を送ってくれたこともあった。\n\nムギの写真も送ってくれた。\nかわいくて、私も飼っているハムスターの\nくるみの写真を送った。\n「会わせたら大変なことになるね」って\n二人で笑った。\n\n特別なことは何もないのに——\nなんか、話しやすいなと思った。",next:"trust"},trust:{type:"chat",header:"ある日のメッセージ——",messages:[{from:"ren",text:"今日も疲れた〜学校しんどい"},{from:"yui",text:"わかる。なんか色々あるよね"},{from:"yui",text:"今日ちょっとれんくん動き良くなかったね。何かあった？"},{from:"ren",text:"……気づいてたんだ",extraDelay:800},{from:"yui",text:"なんとなく"}],next:"trust2"},trust2:{type:"chat",header:null,messages:[{from:"ren",text:"実はさ、親に進路のこと色々言われて"},{from:"yui",text:"そっか……大変だったね"},{from:"ren",text:"結衣ちゃんってなんでそんな優しいの"},{from:"yui",text:"そんなことないよ笑"},{from:"ren",text:"ちょっとだけ真面目な話していい？誰にも言ってないことなんだけど"}],next:"choice_listen"},choice_listen:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"うん、聞くよ",next:"secret_ren"},{label:"どうしたの？",next:"secret_ren"}]},secret_ren:{type:"chat",header:null,messages:[{from:"ren",text:"笑うなよ？結衣ちゃんにしか言ってないから"},{from:"yui",text:"笑わないよ"},{from:"ren",text:"音楽で食っていきたいんだよね。でも親には絶対反対されるし",extraDelay:600},{from:"yui",text:"……すごいじゃん。ちゃんとやりたいことあるんだね"},{from:"ren",text:"そう言ってくれるの結衣ちゃんだけだよ"},{from:"ren",text:"結衣ちゃんは？なんか夢とかある？"}],next:"mono_dream"},mono_dream:{type:"monologue",text:"私だけに話してくれた。\nなんかうれしい……\n\nお互いのこと、いろんな話してきた。\n学校の友達には言えないことも。\n私たちしか知らないことがある。\n\nれんくんなら——\n笑わないかもしれない。",next:"choice_share"},choice_share:{type:"choice",prompt:"れんくんなら……話してみようかな。",choices:[{label:"少し……話してみようかな",next:"dream"},{label:"やっぱり言えない",next:"good_end_silent"}]},good_end_silent:{type:"good_end",title:"言わなかった。",body:"話すかどうかは、自分で決めていい。\n相手が先に秘密を話してくれても、お返しに自分の秘密を話す必要はないよ。\n\n話したくなった気持ちも、話さなかった選択も、大切にしていい。\n\n────────────────\n🔍 振り返るポイント：お返ししたくなる気持ち\n\n秘密を打ち明け合うことは、普段の友達付き合いにもある。\nそれ自体で相手に悪意があるとは決められない。\n\n「自分も話さなきゃ」と感じたら、いったん待っていい。\n話さない選択や、自分のペースも尊重されているかな。"},dream:{type:"chat",header:null,messages:[{from:"yui",text:"実はアイドルになりたいんだよね",readDelay:800},{from:"ren",text:"え、まじで？"},{from:"yui",text:"引いた？笑"},{from:"ren",text:"全然。なんで笑うの。夢じゃん"},{from:"ren",text:"てか結衣ちゃんって絶対モテるよね。アイドルも全然いけると思う",extraDelay:400},{from:"yui",text:"学校の友達には言えなくて"},{from:"ren",text:"わかる。俺も同じだよ。だから結衣ちゃんに話せてよかった"},{from:"yui",text:"うん……私も"}],next:"hair_talk"},hair_talk:{type:"chat",header:null,messages:[{from:"ren",text:"結衣ちゃんってさ、髪型とかどんな感じにしてるの？"},{from:"yui",text:"え、普通かな。おろしてることが多い"},{from:"ren",text:"ポニーテールとかは？"},{from:"yui",text:"たまにする"},{from:"ren",text:"なんか似合いそう。ちょっと見てみたいな"}],next:"mono_photo1"},mono_photo1:{type:"monologue",text:"写真……？\nなんで急に、って思った。\n\nくるみの写真は送ったことある。\nれんくんのムギも見た。\nでも——それとこれは、なんか違う気がする。\n\nなんで違うんだろう。\nうまく言葉にできない。\nでも悪い人じゃないのはわかってるし、\nムギのこと話してくれた。\n私の夢も笑わなかった。\n\nそんな人が、悪い人なわけないよね。",next:"choice_hair1"},choice_hair1:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"なんか怖い……写真は嫌だな",next:"hair_refuse1"},{label:"そんなことないよ笑",next:"hair_flow"},{label:"ドキドキするけど……送ってみる",next:"exchange_offer"},{label:"なんか怖い……ブロックする",next:"block_scene"}]},block_scene:{type:"chat",header:null,messages:[{from:"yui",text:"（ブロックする前に、メッセージが続いた）",readDelay:2000},{from:"ren",text:"え、なんで？",extraDelay:1200},{from:"ren",text:"ちょっと待って",extraDelay:600},{from:"ren",text:"なんで急にブロックするの",extraDelay:400},{from:"ren",text:"返事して",extraDelay:400}],next:"block_silence"},block_silence:{type:"narration",variant:"dark",lines:["結衣はれんくんをブロックした。\nメッセージは、もう届かない。","怖かった。\nでも——\nブロックしてよかった。"],next:"good_end_block"},good_end_block:{type:"good_end",title:"ブロックした。",body:"怖いと感じたときは、連絡を止めたり、距離を置いたりしていい。\n相手が悪い人だと証明できなくても大丈夫。\n説明や返事を続ける義務はないよ。\n\n不安が残ったり、別の場所から連絡が来たりしたら、話せる大人に相談してね。\n\n────────────────\n🔍 振り返るポイント：親しさと自分の意思\n\n何週間も楽しく話すうちに、親しくなるのは自然なこと。\nその時間や、相手を好きになった気持ちが悪いわけではない。\n\n親しい相手でも、返事を待ってほしいときや、断りたいときはある。\n自分の気持ちを後回しにしなくていい。\n怖さを感じなかったとしても、あなたが悪いわけではないよ。"},hair_refuse1:{type:"chat",header:null,messages:[{from:"yui",text:"写真はちょっと……",readDelay:1200},{from:"ren",text:"あ、いきなりすぎたね。ごめん",extraDelay:600},{from:"yui",text:"ううん、大丈夫"},{from:"ren",text:"結衣ちゃんのこと気になってるから、つい"}],next:"hair_days_later"},hair_days_later:{type:"chat",header:"数日後——",messages:[{from:"ren",text:"今日学校どうだった？"},{from:"yui",text:"普通かな〜"},{from:"ren",text:"そっか。あのさ、この前ポニーテールの話したじゃん"},{from:"yui",text:"うん"},{from:"ren",text:"今日してる？"}],next:"choice_hair2"},choice_hair2:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"してるよ",next:"exchange_offer"},{label:"なんで急に……やだ",next:"hair_why"}]},hair_why:{type:"chat",header:null,messages:[{from:"yui",text:"なんで？",readDelay:1000},{from:"ren",text:"いや、なんかずっと気になってて笑　変かな",extraDelay:400},{from:"yui",text:"変ってわけじゃないけど……"},{from:"ren",text:"写真一枚だけ見せてよ。それだけだから"}],next:"choice_hair3"},choice_hair3:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"やっぱり……やだ",next:"good_end_A"},{label:"一枚だけなら…",next:"exchange_offer"}]},good_end_A:{type:"good_end",title:"断り続けた。",body:"「ちょっとだけ」「一枚だけ」でも、嫌なら断っていい。\n理由をうまく説明できなくても大丈夫。\n\nこの場面では、れんは写真を求め続けた。\n何度も頼まれて困ったら、一人で対応しなくていいよ。\n\n────────────────\n🔍 振り返るポイント：断ったあとの反応\n\n小さなお願いをしたことだけで、相手の意図は決められない。\nただ、断っているのに繰り返し頼まれると、断りづらくなることがある。\n\n大切なのは、頼みの小ささより、自分がどうしたいか。\n断れなかったときも、自分を責めず、あとからやめたり相談したりしていい。"},hair_flow:{type:"chat",header:null,messages:[{from:"ren",text:"えー、でも気になる。ちょっとだけ見せてよ"},{from:"yui",text:"ちょっとだけって……"},{from:"ren",text:"一枚だけ！写真一枚だけでいいから"}],next:"choice_hair1b"},choice_hair1b:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"やっぱり……やだ",next:"good_end_A"},{label:"一枚だけなら……",next:"exchange_offer"}]},exchange_offer:{type:"chat",header:null,messages:[{from:"ren",text:"じゃあさ、俺の顔写真、結衣ちゃんにだけ送るよ"},{from:"yui",text:"え、いいの？"},{from:"ren",text:"結衣ちゃんのことちゃんと信用してるから"},{from:"ren",text:"（写真が届いた）",extraDelay:1000},{from:"yui",text:"……"},{from:"ren",text:"だから結衣ちゃんも。おそろいで笑"}],next:"mono_exchange"},mono_exchange:{type:"monologue",text:"れんくんも送ってくれた。\n信用してくれてるんだ……\n\nなんか変な感じはする。\nでも——\n断ったら、今まで話してきたこと全部、\nなかったことになるみたいで。\n失礼だよね。",next:"choice_exchange"},choice_exchange:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"やっぱり送らない",next:"exchange_refuse"},{label:"……わかった",next:"sent_ponytail"}]},exchange_refuse:{type:"chat",header:null,messages:[{from:"yui",text:"やっぱり送らない",readDelay:1200},{from:"ren",text:"え……俺は送ったじゃん",extraDelay:800},{from:"yui",text:"……ごめん"},{from:"ren",text:"結衣ちゃんのこと信用してたのに"}],next:"choice_exchange2"},choice_exchange2:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"それでも……送らない",next:"good_end_exchange"},{label:"……少しだけなら",next:"sent_ponytail"}]},good_end_exchange:{type:"good_end",title:"断れた。",body:"相手が写真を送ってくれても、自分も送る義務はないよ。\nお返しをしたい気持ちと、写真を送りたい気持ちは別に考えていい。\n\n好きな相手でも、嫌なことは断っていい。\n\n────────────────\n🔍 振り返るポイント：お返しを求める圧力\n\n写真や贈り物をくれること自体が、悪意の証拠になるわけではない。\nこの場面で注目したいのは、結衣が断ったあとに、れんが「俺は送ったじゃん」「信用してたのに」と送るよう迫ったこと。\n\n感謝していても、応じなくていい。\n送ったあとで困ったときも、相談していいよ。"},sent_ponytail:{type:"chat",header:null,messages:[{from:"yui",text:"（写真を送った）",readDelay:2000},{from:"ren",text:"ありがとう！やっぱかわいいじゃん",extraDelay:800},{from:"yui",text:"やばい恥ずかしい笑"},{from:"ren",text:"もっと見たいな。笑ってるやつ"}],next:"mono_after_send"},mono_after_send:{type:"monologue",text:"かわいいって言ってくれた。\nうれしい……\n\nでも——\nもっと見たいって、どういうこと？\n変だと思う。\nでもここまで来て、\nそんなこと言うのも……",next:"choice_more"},choice_more:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"やっぱりもう送りたくない",next:"more_refuse"},{label:"しょうがないな……",next:"sent_smile"}]},more_refuse:{type:"chat",header:null,messages:[{from:"yui",text:"もう送らない",readDelay:1500},{from:"ren",text:"え、なんで？俺なんかした？",extraDelay:600},{from:"yui",text:"そういうわけじゃないけど"},{from:"ren",text:"結衣ちゃんのこと応援してるから見たいだけだよ。ダメかな"}],next:"choice_more2"},choice_more2:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"……ダメ。これ以上は",next:"good_end_B"},{label:"……わかった",next:"sent_smile"}]},good_end_B:{type:"good_end",title:"断れた。",body:"一枚送ったあとでも、次は送らないと決めていい。\n前に送ったことは、次も送る約束ではないよ。\n\n────────────────\n🔍 振り返るポイント：応援と要求は分けて考える\n\n「応援している」という言葉だけで、相手の本心は決められない。\nこの場面では、結衣が「もう送らない」と伝えたあとも、れんは応援を理由に写真を求めていた。\n\n応援してくれる人に、嫌なことまで応じる必要はない。\n相手を好きなままでも、断ったり、誰かに相談したりしていい。"},sent_smile:{type:"chat",header:"数日後——",messages:[{from:"ren",text:"最近どう？アイドルの夢、進んでる？"},{from:"yui",text:"進んでないよ笑　どうすればいいかもわかんないし"},{from:"ren",text:"実はさ、知り合いにスカウトやってる人いるんだよね"},{from:"yui",text:"え、まじで？"},{from:"ren",text:"結衣ちゃんの写真見せたら興味持つかもって思って。ただもうちょっとちゃんとした写真があるといいって言われそうで"},{from:"yui",text:"ちゃんとした写真って？"},{from:"ren",text:"スタイルがわかるやつ。水着とかそういう感じの"}],next:"mono_scout"},mono_scout:{type:"monologue",text:"スカウト……？\n本当にそんな人いるの？\n\n水着って……なんか変だと思う。\nでもれんくんが嘘をつくとは思えない。\nずっと話してきた。\n夢のことも、応援してくれてた。\n\nアイドルになれるかもしれない、って思うと……",next:"choice_swim"},choice_swim:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"それは絶対無理",next:"swim_refuse"},{label:"水着って普通なの？",next:"normalized"},{label:"夢のためなら……少しだけ",next:"sent_body"}]},swim_refuse:{type:"chat",header:null,messages:[{from:"yui",text:"それは無理",readDelay:2000},{from:"ren",text:"そっか……残念だな",extraDelay:1000},{from:"yui",text:"……"},{from:"ren",text:"夢、本気じゃないの？"}],next:"choice_dream"},choice_dream:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"本気だけど、それとこれは別",next:"good_end_C"},{label:"本気だけど……",next:"swim_waver"}]},good_end_C:{type:"good_end",title:"断れた。",body:"夢を大切にすることと、嫌な要求に応じることは別だよ。\n「本気なら送って」と言われても、夢への気持ちを写真で証明する必要はない。\n\n────────────────\n🔍 振り返るポイント：大切な気持ちを条件にされること\n\nこの場面では、れんは写真を断った結衣に「夢、本気じゃないの？」と問いかけた。\n夢を応援することと、断る気持ちを否定することは違う。\n\n本当に必要な話なのか、返事を急がず、信頼できる大人と一緒に確かめていい。\n夢を話したことや、期待したことは悪くないよ。"},swim_waver:{type:"chat",header:null,messages:[{from:"ren",text:"だよね。結衣ちゃんなら絶対いけると思うから"},{from:"yui",text:"でもやっぱり水着は……"},{from:"ren",text:"水着って言ってもビーチで撮るような感じだよ。芸能界って普通なんだよね"},{from:"yui",text:"そうなのかな……"},{from:"ren",text:"嫌なら全然いいよ。ただ夢に近づけるかもって思っただけで"}],next:"choice_waver"},choice_waver:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"やっぱり嫌だ……送らない",next:"good_end_D"},{label:"夢のためなら……少しだけ",next:"sent_body"}]},good_end_D:{type:"good_end",title:"断れた。",body:"「普通だよ」「みんなやっている」と言われても、嫌なことはしなくていい。\nよく分からないときは、今すぐ決めなくていいよ。\n\n────────────────\n🔍 振り返るポイント：言葉と、そのあとの行動\n\n「嫌ならいいよ」と言って、本当に断る気持ちを尊重する人もいる。\nこの物語では、れんはそう言いながら、夢の話を持ち出して写真を求め続けた。\n\nその言葉だけで判断せず、自分の意思が尊重されているかを考えてみよう。\n迷っても、応じたあとでも、話せる大人と一緒に考えていい。"},normalized:{type:"chat",header:null,messages:[{from:"yui",text:"水着って普通なの？",readDelay:1200},{from:"ren",text:"モデルとかだと普通らしいよ。芸能界ってそういうもんじゃん",extraDelay:400},{from:"yui",text:"そうなのかな……"},{from:"ren",text:"嫌なら全然いいよ。ただ夢に近づけるかもって思っただけで"}],next:"choice_normalized"},choice_normalized:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"やっぱり嫌だ……送らない",next:"good_end_D"},{label:"夢のためなら……少しだけ",next:"sent_body"}]},sent_body:{type:"chat",header:null,messages:[{from:"yui",text:"（写真を送った）",readDelay:2500},{from:"ren",text:"ありがとう。かわいい",extraDelay:1000},{from:"yui",text:"……本当に知り合いの人だけに見せるよね"},{from:"ren",text:"もちろん。ていうかもう一枚ほしいな。もっとわかりやすいやつ"},{from:"yui",text:"え……もう一枚？"},{from:"ren",text:"ここまで送ってくれたじゃん。今さらじゃない？"}],next:"mono_nowwhat"},mono_nowwhat:{type:"monologue",text:"今さら……\nそうかもしれない。\n\nなんかおかしい、とは思う。\nでも——\nここまで信じてきたのに。\n全部間違いだったなんて、\nそんなこと、あるの？",next:"choice_nowwhat"},choice_nowwhat:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"やっぱりもう送らない",next:"good_end_E"},{label:"……どうしたらいいかわからない",next:"escalate2"}]},good_end_E:{type:"good_end",title:"断れた。",body:"「今さら」と言われても、何枚送ったあとでも、これ以上は送らないと決めていい。\n以前の選択に、今の自分が縛られる必要はないよ。\n\n怖さや不安があるなら、一人で対応せず、話せる大人に助けを求めてね。\n\n────────────────\n🔍 振り返るポイント：途中で気持ちを変えていい\n\nこの場面では、れんは前に写真を送ったことを理由に、さらに送るよう求めた。\nでも、前に応じたことは、これからも応じる約束ではない。\n\nすぐに断れなかったとしても、あなたが悪いわけではない。\n今からでも、助けを借りていいよ。"},escalate2:{type:"chat",header:"それから——",messages:[{from:"ren",text:"結衣ちゃん、昨日の続き"},{from:"ren",text:"早く送って"},{from:"yui",text:"……ちょっと待って",readDelay:1000},{from:"ren",text:"なんで？約束したじゃん"},{from:"ren",text:"ねえ、無視してるの？"},{from:"ren",text:"返事して"}],next:"escalate3"},escalate3:{type:"chat",header:null,messages:[{from:"yui",text:"もう送れない",readDelay:1500},{from:"ren",text:"は？",extraDelay:400},{from:"ren",text:"じゃあ今まで送ってくれた写真、みんなに見せるけどいいの？",extraDelay:600},{from:"yui",text:"え……"},{from:"ren",text:"学校の友達にも、家族にも"},{from:"yui",text:"やめて……"},{from:"ren",text:"じゃあ送って"}],next:"mono_threat"},mono_threat:{type:"monologue",text:"頭が真っ白になった。\nどうしよう。\nお母さんに知られたら……\n友達に知られたら……\nどうしたらいいの。",next:"choice_threat"},choice_threat:{type:"choice",prompt:"結衣はどうする？",choices:[{label:"怖い。でも……送らない",next:"good_end_F"},{label:"怖くて動けない……",next:"truth"},{label:"……お母さんに話す",next:"tell_parent"}]},tell_parent:{type:"monologue",text:"怖くて、手が震えた。\n\nでも——\n一人じゃ無理だと思った。\n\nお母さんの部屋のドアをノックした。",next:"parent_talk"},parent_talk:{type:"narration",variant:"warm",lines:["「ねえ、お母さん……\nちょっと聞いてほしいことがあって」","全部話した。\n震えながら、全部。","お母さんは「なんで……」と言いかけて、\n黙った。\n\nしばらくして、\n「話してくれてよかった」と言った。\n声が少し震えていた。","「一緒に警察に行こう。\nあなたは何も悪くない」"],next:"good_end_parent"},good_end_parent:{type:"good_end",title:"話せた。",body:"一人で抱えなかった。\nそれが、一番大事なことだった。\n\n怖くて当然だ。\n恥ずかしくて当然だ。\nでも——話したことで、\n一人じゃなくなった。\n\n結衣は何も悪くない。\n利用したのは相手だ。\n\n📞 子どもの人権110番（無料）\n0120-007-110\n📞 警察相談専用電話\n#9110\n\n────────────────\n🔍 なぜ一人で抱えてしまうのか\n\n相談しづらい理由は、人によって違う。\n自分を責めたり、怒られるのを心配したり、\n相手を好きな気持ちが残っていたりすることもある。\n話せなかったことも、被害を受けた人の責任ではない。\n\n親や教師は、責めるより先に守ることができる。\n「話してくれてありがとう」——\nそう言える大人が、子どものそばにいてほしい。"},good_end_F:{type:"good_end",title:"送らなかった。",body:"「写真を拡散する」——\nこれは脅迫だ。犯罪だ。\n\nあなたは何も悪くない。\n怖くて当然だ。\n\nさらに送っても、要求が止まる保証はない。\nこれ以上応じる義務はないよ。\n\n今すぐ、信頼できる大人に話してほしい。\n親、先生、どちらでもいい。\n一人で抱えなくていい。\n\n📞 子どもの人権110番（無料）\n0120-007-110\n📞 警察相談専用電話\n#9110\n\n────────────────\n🔍 この手口：セクストーション（性的脅迫）\n\n画像や動画をネタに金品や追加画像を要求する犯罪で、\n日本でも年々増加している。\n被害者が「自分が悪い」と思い込むよう仕向けられるが、\n悪いのは100%加害者だ。\n送ってしまった画像のことも、相談していい。\n一人で抱えず、助けを借りていい。"},truth:{type:"narration",variant:"dark",lines:["「写真を拡散する」\nその言葉で、頭が真っ白になった。","——どうしたらいいかわからない。","——誰にも言えない。","——全部自分が悪いんだ。"],next:"reveal"},reveal:{type:"narration",variant:"warm",lines:["ちょっと待って。","結衣は\n何も悪くない。","「今さらじゃない」は嘘だ。\n一枚送ったことは、次を送る理由にならない。","夢を応援してくれると思っていた。\n信頼していた。\nそれは結衣が悪いんじゃない——\n相手が、それを利用したんだ。","「優しい人」だと思っていた。\nだから信じた。\n怖い人なら、誰でも警戒する。\nでも——優しくしてくれたことだけでは、\n相手が安全かどうかは分からない。","そして——\n「れん」は高1じゃなかった。","プロフィールの写真は別人のもの。\n大人の男性が、同じ手口で\n複数の中学生に近づいていた。","ムギの写真は、\nどこかから拾ってきた画像だった。\n\nギターの動画だけは——\n本物だった。","全部が嘘じゃなかった。\nだから、気づけなかった。\nそれは結衣のせいじゃない。\n\n本当を混ぜるから、わからなくなる。","結衣は何も悪くない。\n二重に騙されていた。"],next:"resources"},resources:{type:"resources"}};const ADULT_SCENES={adult_intro:{type:"choice",prompt:"シナリオを選んでください",choices:[{label:"「ネットで友達できた」と子どもが言っている",next:"adult_A1"},{label:"子どもが急に元気がなくなった",next:"adult_B1"},{label:"子どもが泣きながら相談してきた",next:"adult_C1"}]},adult_A1:{type:"narration",variant:"default",lines:["中学生の子どもが夕食のとき、\nこう言った。","「ゲームで知り合ったんだけど、\nれんくんっていう人がいて——\nすごく話しやすいんだよね」","あなたはどう返しますか？"],next:"adult_A_choice"},adult_A_choice:{type:"choice",prompt:"あなたはどう返す？",choices:[{label:"「ネットの人は危ないよ」と注意する",next:"adult_A_warn"},{label:"「どんな人なの？」と話を聞く",next:"adult_A_listen"},{label:"「会ったりしないでよ」とだけ言う",next:"adult_A_forbid"}]},adult_A_warn:{type:"good_end",title:"注意した。でも……",body:"気持ちはわかる。\nただ、「危ない」とだけ伝えると、\n楽しく話していた気持ちを否定されたように感じて、\n話しづらくなることもある。\n\n一度強く言ってしまっても、聞き直していい。\n「心配で強く言ってしまった。どんな話をしているのか、聞かせてほしい」と伝え直せる。\n\n────────────────\n💡 より良い対応\n\nまず「そっか、楽しそうだね」と受け止める。\nそのうえで「どんな人なの？」と聞く。\n普段から話を聞くことが、\n困ったときに相談しやすい関係につながる。"},adult_A_listen:{type:"good_end",title:"話を聞いた。",body:"これが一番大事なことだ。\n\n「話しやすいな」と思える大人が\nそばにいること——\nそれが子どもを守る。\n\n会話の中で\n「写真とか送ってって言われたりしてない？」\nと自然に聞けると、もっといい。\n\n────────────────\n💡 グルーミングの早期発見のために\n\n・特定の「ネット友達」の話を頻繁にする\n・スマホを隠すようになった\n・夜遅くまでスマホを使っている\n・急に元気がなくなった\n\nこうした変化だけで、被害があるとは判断できない。\n気になる変化があれば、決めつけずに話を聞いてほしい。\n目立つ変化がない場合も、相談できる関係を大切にしてほしい。"},adult_A_forbid:{type:"good_end",title:"禁止した。でも……",body:"「会わない」は大事なルールだ。\nでも禁止だけでは不十分。\n\n子どもはすでにオンラインで\n毎日話しているかもしれない。\n実際に会わなくても、オンラインのやり取りの中で\n嫌な要求や圧力を受けることがある。\n\n────────────────\n💡 より良い対応\n\n安全のためのルールと、気持ちを聞くことを両方大切にする。\n「どんな人なの？」と話を聞き、\n困ったときの対応を一緒に考える。\nすぐに話せなくても、相談する道は残しておく。"},adult_B1:{type:"narration",variant:"default",lines:["最近、子どもの様子がおかしい。","食欲がなく、スマホをすぐ隠す。\n部屋にこもることが増えた。","夕食のとき、思い切って聞いてみた。","「最近なんか元気ないけど、\n何かあった？」","子どもはスマホから目を上げずに言った。\n\n「……なんでもない」","あなたはどうする？"],next:"adult_B_choice1"},adult_B_choice1:{type:"choice",prompt:"あなたはどうする？",choices:[{label:"「なんでもないわけないでしょ」と押す",next:"adult_B_push"},{label:"「そっか。何かあれば話してね」と伝える",next:"adult_B_wait1"},{label:"「スマホ見せて」と言う",next:"adult_B_check"}]},adult_B_push:{type:"narration",variant:"default",lines:["「なんでもないわけないでしょ。\n最近おかしいじゃない」","子どもは黙って部屋に戻った。","ドアが閉まる音がした。"],next:"adult_B_push_end"},adult_B_push_end:{type:"good_end",title:"押しすぎた。",body:"心配だから聞きたい——その気持ちはわかる。\n\nでも「なんでもないわけない」は\n子どもには「信じてもらえない」と聞こえることもある。\nこの場面では、結衣はさらに話しづらくなっていた。\n「問い詰めたかったわけじゃない。話せるときに聞きたい」と伝え直していい。\n\n────────────────\n💡 「なんでもない」のあとにできること\n\n「そっか、でも心配してるよ」と\n一言だけ添えて引く。\n今日話さなくていい——\nでも扉は開けておく。\nその積み重ねが、いざというときに効く。"},adult_B_check:{type:"narration",variant:"default",lines:["「ちょっとスマホ見せて」","子どもの顔が強ばった。","「なんで。見せなきゃダメなの」\n\n険しい顔で、スマホを握りしめた。"],next:"adult_B_check_end"},adult_B_check_end:{type:"good_end",title:"壁ができた。",body:"守りたい気持ちからの行動だった。\n\nただ、理由を説明せずに「見せて」と迫ると、\n信用されていないと感じる子どももいる。\n確認が必要なときは、何が心配なのかを伝え、\n一緒に確認する方法を考えてほしい。\n\n────────────────\n💡 スマホより先にすること\n\n「最近元気なさそうで心配してる」\nと気持ちを伝える。\n話せる空気を作りながら、\n安全のために何を確認する必要があるか、一緒に考える。"},adult_B_wait1:{type:"narration",variant:"default",lines:["「そっか。\n何かあれば話してね」","子どもは小さく頷いた。\nそれだけだった。","数日が経った。\n\n様子は変わらない。\nむしろ、少し顔色が悪くなった気がする。","夜、子どもがリビングに水を飲みに来た。\nあなたはどうする？"],next:"adult_B_choice2"},adult_B_choice2:{type:"choice",prompt:"あなたはどうする？",choices:[{label:"「まだ何かあるの？」とまた聞く",next:"adult_B_again"},{label:"「最近よく眠れてる？」と声をかける",next:"adult_B_soft"},{label:"そっとしておく",next:"adult_B_leave"}]},adult_B_again:{type:"narration",variant:"default",lines:["「ねえ、まだ何かあるんじゃないの？」","子どもは少し黙ってから言った。\n\n「……何もないって言ってるじゃん」","それ以上、言葉が出なかった。"],next:"adult_B_again_end"},adult_B_again_end:{type:"good_end",title:"また押してしまった。",body:"心配が伝わっていない——\nそう感じるとまた聞きたくなる。\n\n繰り返し聞かれることが、\n「早く話さなければ」という負担になる場合もある。\nこの場面では、結衣は距離を置くようになった。\n答えを急がせず、そばにいることを伝える方法もある。\n\n────────────────\n💡 違う角度から声をかける\n\n「何かあった？」じゃなく\n「最近よく眠れてる？」「ごはん食べられてる？」\n答えやすい質問から入ると\n子どもが話しやすくなることがある。"},adult_B_leave:{type:"narration",variant:"default",lines:["声をかけるのをやめた。\nそっとしておこうと思った。","翌朝、子どもは学校を休みたいと言った。","お腹が痛い、と。"],next:"adult_B_leave_end"},adult_B_leave_end:{type:"good_end",title:"待ちすぎた。",body:"「そっとしておく」は優しさだ。\nただ、気になる変化が続くときは、\n本人が話すまで大人も一人で待ち続ける必要はない。\n\n体調や生活の様子にも目を向け、\n決めつけず、学校や相談先と対応を考えていい。\n\n────────────────\n💡 今すぐできること\n\n学校を休む日に、\n一緒にゆっくり過ごす。\n「話さなくていい。\nそばにいるよ」という時間が\n子どもの心を少しだけ軽くする。\n\n📞 子どもの人権110番：0120-007-110"},adult_B_soft:{type:"narration",variant:"default",lines:["「最近よく眠れてる？」","子どもは少し驚いた顔をした。\n\n「……あんまり」","「そっか。\nごはんも食べられてないしね。\n心配してるよ」","子どもは黙って水を飲んだ。\nでも——部屋に戻る前に、振り返った。","「……ちょっとだけ、聞いてもらっていい？」","あなたはどう返す？"],next:"adult_B_choice3"},adult_B_choice3:{type:"choice",prompt:"あなたはどう返す？",choices:[{label:"「もちろん。座って」と受け止める",next:"adult_B_open2"},{label:"「やっぱり何かあったんじゃない！」と反応する",next:"adult_B_react"}]},adult_B_react:{type:"narration",variant:"default",lines:["「やっぱり何かあったんじゃない！\nずっと心配してたんだよ！」","子どもの顔が閉じた。","「……やっぱりいい」\n\n部屋に戻っていった。"],next:"adult_B_react_end"},adult_B_react_end:{type:"good_end",title:"あと一歩だった。",body:"「やっぱりあったんじゃない」は\n責めているつもりはなかった。\n\nでも子どもには\n「怒られる」「騒がれる」と聞こえた。\n勇気を出して振り返ったのに、\nその扉がまた閉じてしまった。\n\n────────────────\n💡 子どもが話しかけてきたとき\n\n驚く気持ちがあっても、まず落ち着いて聞こうとする。\n「話してくれてありがとう」「聞かせて」と伝えていい。\n強く反応してしまったら、\n「驚いたけれど、あなたを責めているわけではない」と言い直せる。\n子どもは大人の反応を見て\n「話していいか」を判断している。"},adult_B_open2:{type:"narration",variant:"warm",lines:["「もちろん。座って」","子どもはゆっくりソファに座った。\n\nしばらく黙っていた。","「……ネットで知り合った人がいて」","「写真を送っちゃって。\nそれで……」","全部は話せなかった。\nでも——話し始めた。","あなたはどう返す？"],next:"adult_B_choice4"},adult_B_choice4:{type:"choice",prompt:"あなたはどう返す？",choices:[{label:"「話してくれてありがとう」と言う",next:"adult_B_best"},{label:"「写真って何を送ったの！」と聞く",next:"adult_B_shock"}]},adult_B_shock:{type:"good_end",title:"動揺してしまった。",body:"怖くて当然だ。\n怒りたくて当然だ。\n\nただ、詳しいことを急いで聞くと、\n責められているように感じる子どももいる。\nまず話してくれたことを受け止め、\n確認が必要なことは、その理由も伝えながら聞いてほしい。\n\n────────────────\n💡 まず言うべき言葉\n\n「話してくれてありがとう」\n「あなたは悪くない」\n\n詳しいことはあとで聞ける。\n今この瞬間に必要なのは\n子どもが「話してよかった」と思えることだ。"},adult_B_best:{type:"good_end",title:"受け止めた。",body:"「話してくれてありがとう」——\nこの言葉が、子どもを守った。\n\n何日もかかった。\n一回で話してくれなかった。\n声のかけ方を変えながら、\n待ち続けた。\n\nそれが実った。\n\n────────────────\n💡 次のステップ\n\n「あなたは悪くない」と伝える。\n一緒に警察に相談しに行く。\n送ってしまった画像でも、\n警察が対処できる。\n\n「もう手遅れ」ではない。\n\n📞 警察相談専用電話：#9110\n📞 子どもの人権110番：0120-007-110"},adult_C1:{type:"narration",variant:"dark",lines:["夜、子どもが泣きながら部屋から出てきた。","「ネットで知り合った人に……\n写真を送っちゃって。\n拡散するって言われてる」","あなたはどう返しますか？"],next:"adult_C_choice"},adult_C_choice:{type:"choice",prompt:"あなたはどう返す？",choices:[{label:"「なんでそんなことしたの」と聞く",next:"adult_C_blame"},{label:"「話してくれてありがとう」と言う",next:"adult_C_accept"},{label:"すぐにスマホを取り上げる",next:"adult_C_take"}]},adult_C_blame:{type:"good_end",title:"責めてしまった。",body:"気持ちはわかる。\n怖くて、怒りたくなる。\n\nただ、「なんで」と強く聞かれると、\n責められたように感じ、話しづらくなることもある。\n\n言ってしまったあとでも、\n「心配で強く言ってしまった。あなたを責めたいわけじゃない」と伝え直していい。\n\n────────────────\n💡 まず言うべき言葉\n\n「話してくれてありがとう」\n「あなたは悪くない」\n\nこの二言が、子どもを守る。\nそのあとで、一緒に警察に相談しに行く。\n\n📞 警察相談専用電話：#9110"},adult_C_accept:{type:"good_end",title:"受け止めた。",body:"「話してくれてありがとう」——\nまず、話してくれたことを受け止めたい。\n\n子どもは勇気を出して話した。\nその勇気を受け止めることが、\n大人にできる一番大事なことだ。\n\n次のステップ：\n「あなたは悪くない」と伝える。\n一緒に警察に相談する。\n\n────────────────\n💡 警察への相談について\n\n送ってしまった画像は、\n警察が削除要請などの対処ができる。\n「もう手遅れ」ではない。\n早く相談するほど、できることが増える。\n\n📞 警察相談専用電話：#9110\n📞 子どもの人権110番：0120-007-110"},adult_C_take:{type:"good_end",title:"スマホを取り上げた。",body:"守りたい気持ちはわかる。\n\nでも、スマホを取り上げても\n相手の手元に画像は残る。\n証拠も消えてしまうかもしれない。\n\nまず子どもの話を聞く。\n「あなたは悪くない」と伝える。\nそれから一緒に警察に相談する。\n\n────────────────\n💡 やってはいけないこと\n\n・相手に連絡する（状況が悪化する）\n・画像を自分で拡散確認する\n・子どもを一人で対処させる\n\n一人で抱え込まず、\nすぐに警察か相談窓口へ。\n\n📞 警察相談専用電話：#9110"}};const PHOTO_ASSETS={"mugi":"assets/mugi.webp","kurumi":"assets/kurumi.webp","pudding":"assets/pudding.webp"};PHOTO_ASSETS.guitar='assets/guitar.webp';function VideoPreview(){return React.createElement("figure",{className:"video-preview"},React.createElement("div",{className:"video-still"},React.createElement(StoryPhoto,{asset:"guitar",alt:"\u30AE\u30BF\u30FC
